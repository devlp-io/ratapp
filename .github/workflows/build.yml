name: build agent
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: android-actions/setup-android@v3

    - name: Build APK
      run: |
        curl -s https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt
        /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon -g /opt/gradle-8.5 || exit 1

    - uses: actions/upload-artifact@v4
      with:
        name: agent-apk
        path: app/build/outputs/apk/debug/app-debug.apk
