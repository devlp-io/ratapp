plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.samsung.android.usersuite'
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    flavorDimensions "mode"
    productFlavors {
        stealth {
            dimension "mode"
            applicationId "com.sec.android.app.cloud"
            resValue "string", "app_name", "Samsung Cloud"
        }
        full {
            dimension "mode"
            applicationId "com.samsung.android.usersuite"
            resValue "string", "app_name", "Usersuite"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database'
}
